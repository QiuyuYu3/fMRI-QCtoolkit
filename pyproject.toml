[project]
name = "fmri_qctoolkit"
version = "2.0.0"
description = "MRI Quality Control Dashboard for AFNI and fMRIPrep pipelines"
authors = [
  { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" },
]
maintainers = [
  { name = "Qiuyu Yu", email = "qiuyuyu.psych@gmail.com" }
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["fMRI", "quality control", "MRIQC", "fMRIPrep", "AFNI", "dashboard"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Dash",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.11"
dependencies = [
  "typer>=0.16",
  "dash>=2.17,<5",
  "plotly>=5.20",
  "pandas>=2.1",
  "numpy>=1.26",
  "flask>=3.0"
]

[project.urls]
Homepage = "https://github.com/QiuyuYu3/fMRI-QCtoolkit"
Repository = "https://github.com/QiuyuYu3/fMRI-QCtoolkit"
Issues = "https://github.com/QiuyuYu3/fMRI-QCtoolkit/issues"
Changelog = "https://github.com/QiuyuYu3/fMRI-QCtoolkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=6.0",
  "pytest-cov",
  "black",
  "isort",
  "flake8",
  "ruff"
]

[project.scripts]
fmriqc = "fMRI_QCtoolkit.cli:app"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fMRI_QCtoolkit*"]

[tool.setuptools.package-data]
"fMRI_QCtoolkit" = ["*"]
