name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        resolution: [highest]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            resolution: highest
            browser: true
          - os: ubuntu-latest
            python-version: "3.11"
            resolution: lowest-direct
            browser: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - name: Install
        run: uv pip install --resolution ${{ matrix.resolution }} . "pytest>=8"
      - name: Install the browser
        if: matrix.browser
        run: |
          uv pip install --resolution ${{ matrix.resolution }} "playwright>=1.65"
          python -m playwright install --with-deps chromium
      - name: Test
        env:
          FMRIQC_REQUIRE_BROWSER: ${{ matrix.browser && '1' || '' }}
        run: python -m pytest -q
