name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Check versions and dates
        run: python .github/scripts/check_release.py "$GITHUB_REF_NAME" "$(TZ=America/Chicago date +%F)" notes.md
      - name: Build
        run: uv build
      - name: Check the package
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  test:
    needs: build
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        resolution: [highest]
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            resolution: highest
            browser: true
          - os: ubuntu-latest
            python-version: "3.11"
            resolution: lowest-direct
            browser: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Install the wheel
        # Listing pyproject.toml makes the dependencies direct, so lowest-direct applies to them.
        run: uv pip install --resolution ${{ matrix.resolution }} dist/*.whl -r pyproject.toml "pytest>=8"
      - name: Install the browser
        if: matrix.browser
        run: |
          uv pip install --resolution ${{ matrix.resolution }} "playwright>=1.65"
          python -m playwright install --with-deps chromium
      - name: Test the installed wheel
        # Remove the source so the tests import the installed wheel.
        env:
          FMRIQC_REQUIRE_BROWSER: ${{ matrix.browser && '1' || '' }}
        run: |
          rm -rf fMRI_QCtoolkit
          python -m pytest -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fmri-qctoolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
